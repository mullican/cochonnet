[package]
name = "petanque-tournament"
version = "0.1.0"
description = "Cochonnet - Pétanque Tournament Manager"
authors = ["you"]
edition = "2021"

[lib]
name = "petanque_tournament_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# iPadOS reaches AirPrint only through UIKit. These are already in the graph
# via tauri, so pinning the same 0.3 line costs no extra build.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-core-foundation = "0.3"

# macOS raises the system print panel through PDFKit, which is the only way to
# offer the operator a printer, a page range and the rest of the standard
# options. objc2 and objc2-app-kit already arrive via tauri; pdf-kit is the one
# addition.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "objc2-app-kit"] }
