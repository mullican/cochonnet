<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Steel metallic gradient -->
    <linearGradient id="steelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="20%" stop-color="#d1d5db" />
      <stop offset="40%" stop-color="#9ca3af" />
      <stop offset="60%" stop-color="#6b7280" />
      <stop offset="80%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.7" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="grooveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#374151" stop-opacity="0.5" />
    </linearGradient>
    <!-- Red cochonnet gradient -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="redShineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <!-- The grooves wrap out of sight at the silhouette -->
    <clipPath id="bouleClip">
      <circle cx="256" cy="220" r="200" />
    </clipPath>
  </defs>

  <!-- Shadow for boule -->
  <ellipse cx="256" cy="440" rx="160" ry="20" fill="#1f2937" opacity="0.25" />

  <!-- Main steel boule (moved up) -->
  <circle cx="256" cy="220" r="200" fill="url(#steelGradient)" />

  <!-- Grooves - the machined rings of a boule striée.
       Each is a latitude circle of the sphere, so it projects to an ellipse
       arc whose half-axes share the ratio sin(12°), the angle we look down on
       the ball from - the same reason the shadow below is a flattened ellipse.
       They meet the silhouette exactly, and sag toward the viewer most at the
       equator and least near the poles: the curvature the eye reads as
       roundness. Arc ends are the points where the ring crosses the silhouette,
       so rings above the equator show more than half (large-arc flag 1) and
       those below show less. -->
  <g clip-path="url(#bouleClip)" fill="none" stroke="url(#grooveGradient)" stroke-linecap="round">
    <path d="M 99.9 95 A 158.3 32.9 0 1 0 412.1 95" stroke-width="12" />
    <path d="M 60.5 178 A 195.7 40.7 0 1 0 451.5 178" stroke-width="14" />
    <path d="M 60.5 262 A 195.7 40.7 0 0 0 451.5 262" stroke-width="14" />
    <path d="M 99.9 345 A 158.3 32.9 0 0 0 412.1 345" stroke-width="12" />
  </g>

  <!-- Highlight shine on boule -->
  <ellipse cx="170" cy="120" rx="70" ry="45" fill="url(#shineGradient)" />

  <!-- Small highlight dot on boule -->
  <circle cx="135" cy="95" r="18" fill="white" opacity="0.5" />

  <!-- Shadow for cochonnet -->
  <ellipse cx="256" cy="470" rx="70" ry="10" fill="#1f2937" opacity="0.3" />

  <!-- Red cochonnet (in front) -->
  <circle cx="256" cy="420" r="80" fill="url(#redGradient)" />

  <!-- Highlight shine on cochonnet -->
  <ellipse cx="220" cy="390" rx="30" ry="20" fill="url(#redShineGradient)" />

  <!-- Small highlight dot on cochonnet -->
  <circle cx="205" cy="380" r="10" fill="white" opacity="0.4" />
</svg>
