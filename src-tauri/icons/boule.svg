<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Steel metallic gradient -->
    <linearGradient id="steelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="20%" stop-color="#d1d5db" />
      <stop offset="40%" stop-color="#9ca3af" />
      <stop offset="60%" stop-color="#6b7280" />
      <stop offset="80%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.7" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="grooveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#374151" stop-opacity="0.5" />
    </linearGradient>
    <!-- Red cochonnet gradient -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="redShineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <!-- The stripes wrap out of sight at the silhouette -->
    <clipPath id="bouleClip">
      <circle cx="256" cy="220" r="200" />
    </clipPath>
  </defs>

  <!-- Shadow for boule -->
  <ellipse cx="256" cy="440" rx="160" ry="20" fill="#1f2937" opacity="0.25" />

  <!-- Main steel boule (moved up) -->
  <circle cx="256" cy="220" r="200" fill="url(#steelGradient)" />

  <!-- Stripes - two grooves on perpendicular planes, crossing at (292, 152):
       facing the viewer, but 0.18r right and 0.34r above the centre of the
       disc, so the X sits high and to the right and neither arm is symmetric.

       Each is a great circle, so it projects to an ellipse centred on the
       boule and we draw only its front half: from one silhouette crossing,
       across the face, to the antipodal one. Half-axes are r and r|n.z| for
       the plane normal n, which is why the two bow by different amounts
       (0.13r and 0.36r). That difference is forced, not chosen - a stripe can
       only bow strongly if it crosses the intersection perpendicular to the
       radius, and two perpendicular planes cannot both do that. Pushing the
       crossing further off centre buys more bow for both; dead centre would
       collapse them into a flat painted X.

       Round caps, not butt: the arc ends land exactly on the silhouette, so a
       flat cap stops short of it at an angle and leaves a visible notch. The
       round cap overshoots and the clip trims it flush. -->
  <g clip-path="url(#bouleClip)" fill="none" stroke="url(#grooveGradient)" stroke-width="18" stroke-linecap="round">
    <path d="M 111 357.75 A 200 26.32 136.47 0 1 401 82.25" />
    <path d="M 125.89 68.11 A 200 72.3 -130.58 0 1 386.11 371.89" />
  </g>

  <!-- Owner's mark, the way initials are stamped into a real boule: a bright
       lower edge where the light catches the cut, dark stroke over it. Sits in
       the left cell of the X, clear of both stripes and below the highlight.

       Stripped for anything rendered under 128px - see MARK_MIN_PX in
       scripts/generate-icons.mjs. Below that it stops being letters and turns
       into a grey smudge that just makes the boule look dirty.

       This is the one part of the logo that depends on a font being present
       (Helvetica on this machine); everything else is pure geometry. -->
  <g id="maker-mark" transform="rotate(-12 220 180)">
    <text x="220" y="181.5" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#ffffff" opacity="0.44">LDM</text>
    <text x="220" y="180" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#1f2937" opacity="0.55">LDM</text>
  </g>

  <!-- Highlight shine on boule -->
  <ellipse cx="170" cy="120" rx="70" ry="45" fill="url(#shineGradient)" />

  <!-- Small highlight dot on boule -->
  <circle cx="135" cy="95" r="18" fill="white" opacity="0.5" />

  <!-- Shadow for cochonnet -->
  <ellipse cx="256" cy="470" rx="70" ry="10" fill="#1f2937" opacity="0.3" />

  <!-- Red cochonnet (in front) -->
  <circle cx="256" cy="420" r="80" fill="url(#redGradient)" />

  <!-- Highlight shine on cochonnet -->
  <ellipse cx="220" cy="390" rx="30" ry="20" fill="url(#redShineGradient)" />

  <!-- Small highlight dot on cochonnet -->
  <circle cx="205" cy="380" r="10" fill="white" opacity="0.4" />
</svg>
